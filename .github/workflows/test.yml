name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rx_subscription_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          mkdir -p ci-diagnostics
          # Each shard gets a fresh Next.js process and PostgreSQL service.
          # Capture resource pressure without assuming SIGTERM means OOM.
          (
            while true; do
              date -u
              free -m
              ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,20p'
              for metric in memory.current memory.peak memory.events; do
                if [ -r "/sys/fs/cgroup/$metric" ]; then
                  echo "$metric"
                  cat "/sys/fs/cgroup/$metric"
                fi
              done
              sleep 10
            done
          ) > ci-diagnostics/memory.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          bun run test:e2e --shard=${{ matrix.shard }}/2 --reporter=line,html 2>&1 | tee ci-diagnostics/playwright.log

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            ci-diagnostics/
            playwright-report/
            test-results/
          retention-days: 7

  # Preserve the existing required check while requiring every shard to pass.
  test:
    if: ${{ always() }}
    needs: [unit, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all tests to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$E2E_RESULT" = success
